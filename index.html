<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Prompt Lab — AI Creator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #121d2e;
      --panel-2: #18263a;
      --text: #edf3fb;
      --muted: #9aabc0;
      --accent: #79a9ff;
      --border: #2a3b53;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 32px 18px;
      background: radial-gradient(ellipse at top, #1b3150 0, var(--bg) 58%);
      color: var(--text); font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
    }
    main { width: min(820px, 100%); margin: 0 auto; }
    header { margin: 12px 0 28px; }
    .eyebrow { color: var(--accent); font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1.08; }
    .intro { color: var(--muted); max-width: 600px; }
    .card { background: color-mix(in srgb, var(--panel) 94%, transparent); border: 1px solid var(--border); border-radius: 18px; padding: clamp(18px, 4vw, 28px); box-shadow: 0 18px 60px #0005; }
    label { display: block; margin-bottom: 10px; font-weight: 650; }
    textarea {
      display: block; width: 100%; min-height: 280px; resize: vertical;
      padding: 16px; border: 1px solid var(--border); border-radius: 12px;
      background: #0b1422; color: var(--text); font: 15px/1.6 inherit;
      outline: none;
    }
    textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #79a9ff22; }
    .meta { display: flex; justify-content: space-between; gap: 12px; margin: 10px 2px 20px; color: var(--muted); font-size: .88rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; }
    button {
      border: 1px solid var(--border); border-radius: 10px; padding: 11px 17px;
      color: var(--text); background: var(--panel-2); font: inherit; font-weight: 650;
      cursor: pointer; transition: transform .15s, border-color .15s;
    }
    button:hover { border-color: var(--accent); transform: translateY(-1px); }
    button.primary { background: var(--accent); color: #081426; border-color: var(--accent); }
    button:focus-visible { outline: 3px solid #79a9ff88; outline-offset: 2px; }
    #status { min-height: 24px; margin: 14px 2px 0; color: #9ed9b3; font-size: .9rem; }
    footer { margin: 20px 4px; color: var(--muted); font-size: .82rem; text-align: center; }
    @media (max-width: 520px) {
      body { padding: 18px 12px; }
      .actions button { flex: 1 1 100%; }
      textarea { min-height: 240px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">AI Creator · Workshop 01</div>
      <h1>Prompt Lab</h1>
      <p class="intro">Простое рабочее пространство для написания и подготовки промптов к генерации изображений и видео.</p>
    </header>

    <section class="card" aria-labelledby="prompt-label">
      <label id="prompt-label" for="prompt">Твой промпт</label>
      <textarea id="prompt" placeholder="Опиши сцену, персонажа, движение камеры, освещение и желаемый результат…"></textarea>
      <div class="meta">
        <span id="counter" aria-live="polite">0 символов</span>
        <span>Текст остаётся в этом поле</span>
      </div>
      <div class="actions">
        <button class="primary" id="copy" type="button">Копировать промпт</button>
        <button id="clear" type="button">Очистить поле</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
    </section>

    <footer>Prompt Lab · Первая версия · AI Creator Lab</footer>
  </main>
  <script>
    const promptField = document.querySelector("#prompt");
    const counter = document.querySelector("#counter");
    const status = document.querySelector("#status");

    function updateCounter() {
      const count = promptField.value.length;
      counter.textContent = count.toLocaleString("ru-RU") + " " +
        (count === 1 ? "символ" : count > 1 && count < 5 ? "символа" : "символов");
    }

    promptField.addEventListener("input", updateCounter);

    document.querySelector("#copy").addEventListener("click", async () => {
      if (!promptField.value.trim()) {
        status.textContent = "Сначала напиши промпт.";
        return;
      }
      try {
        await navigator.clipboard.writeText(promptField.value);
        status.textContent = "Промпт скопирован.";
      } catch {
        promptField.select();
        status.textContent = "Автокопирование недоступно. Выдели текст и скопируй его вручную.";
      }
    });

    document.querySelector("#clear").addEventListener("click", () => {
      promptField.value = "";
      updateCounter();
      status.textContent = "Поле очищено.";
      promptField.focus();
    });

    updateCounter();
  </script>
</body>
</html>
